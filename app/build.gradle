plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: the keystore lives OUTSIDE the repo and is optional.
// Path of a properties file (storeFile/storePassword/keyAlias/keyPassword):
//   env ZML_KEYSTORE_PROPS, or /workspace/android/keys/keystore.properties
// Without it the release APK is simply left unsigned.
def ksFile = file(System.getenv('ZML_KEYSTORE_PROPS') ?: '/workspace/android/keys/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'io.github.zmlworks.kpexplorer'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.zmlworks.kpexplorer'
        // 30 (Android 11): framework BiometricPrompt with BIOMETRIC_STRONG + per-use Keystore keys, no AndroidX
        minSdk 30
        targetSdk 35
        versionCode 16
        versionName '0.3.13'
        resourceConfigurations += ['ja']
    }
    signingConfigs {
        release {
            if (ks['storeFile']) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ks['storeFile']) signingConfig signingConfigs.release
            vcsInfo { include false }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig false }
    lint {
        abortOnError true
        disable 'GradleDependency', 'NewerVersionAvailable', 'OldTargetApi', 'AndroidGradlePluginVersion',
                'SetTextI18n', 'HardcodedText', 'ClickableViewAccessibility'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all { maxHeapSize = '1536m' }
        }
    }
    dependenciesInfo { includeInApk false; includeInBundle false }
}

dependencies {
    implementation project(':kotpass')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
